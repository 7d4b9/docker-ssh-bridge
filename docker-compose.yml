networks:
  sshbridge:
    driver: bridge
services:
  server:
    restart: unless-stopped
    image: ${IMAGE:-dbndev/ssh-bridge}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./authorized_keys:/home/debian/.ssh/authorized_keys
      - /workspaces:/workspaces
      - ${PWD}:${PWD}:cached
      - /dev:/dev
      - vscode:/vscode
    working_dir: ${PWD}
    ports:
      - ${VEGITO_SSH_BRIDGE_PORT:-22022}:22
      - ${VEGITO_DOCKER_BRIDGE_PORT:-23750}:2375
    container_name: ssh-server
    environment:
      SSH_PUBLIC_KEY: /home/debian/.ssh/authorized_keys

      VSCODE_SERVER_COMMIT: ${VSCODE_SERVER_COMMIT:-93cfdd489c3b228840d0f86ec77c3636277c93ea}
      VSCODE_SERVER_ARCH:

      VEGITO_DOCKER_REGISTRIES:
      VEGITO_DOCKERHUB_PAT:
      VEGITO_DOCKERHUB_USERNAME:
      VEGITO_DOCKER_BUILDX_ENABLE_ARM_BUILDER:
      VEGITO_DOCKER_BUILDX_NAME:
      VEGITO_DOCKER_BUILDX_ARM_BUILDER_NAME:
      VEGITO_DOCKER_BUILDX_ARM_BUILDER_ENDPOINT:

      VEGITO_PROJECT_USER:
      VEGITO_DOCKER_COMPOSE_HOST:

      VEGITO_STRIPE_DEBUG_KEY:
      VEGITO_STRIPE_PROD_KEY:
      VEGITO_STRIPE_WEBHOOK_SECRET:

      VEGITO_DNS_SERVER: ${VEGITO_DNS_SERVER:-1.1.1.1}

    dns:
      - ${VEGITO_DNS_SERVER:-1.1.1.1}

volumes:
  vscode:
    external: true
    name: vscode
